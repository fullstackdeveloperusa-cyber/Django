{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Details</title>
    <link rel="stylesheet" href="%static 'app1/css/home.css' %">
</head>
<body>

    <h1>School Details</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>School ID</th>
            <th>School Number</th>
            <th>School Name</th>
            <th>School Type</th>
        </tr>

        {% for school in school_list %}
        <tr>
            <td>{{ school.id }}</td>
            <td>{{ school.sno }}</td>
            <td>{{ school.sname }}</td>
            <td>{{ school.stype }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No school records available.</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
